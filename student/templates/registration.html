<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Student services</title>
    <style>
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: #f3f5f8;
            color: #1d2c3b;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        main {
            width: min(100%, 390px);
            padding: 36px;
            border: 1px solid #dce3e9;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 16px 42px rgba(27, 47, 66, .1);
        }
        h1 { margin: 0; color: #18354a; font-size: 27px; }
        .intro { margin: 9px 0 24px; color: #627181; font-size: 14px; line-height: 1.6; }
        form p { margin: 0 0 16px; }
        label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 650; }
        input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #cbd5de;
            border-radius: 7px;
            box-sizing: border-box;
            font: inherit;
        }
        input:focus { border-color: #286184; outline: 3px solid rgba(40, 97, 132, .14); }
        .helptext { display: block; margin-top: 6px; color: #627181; font-size: 12px; line-height: 1.5; }
        ul.errorlist { margin: 6px 0; padding-left: 18px; color: #963b35; font-size: 12px; }
        button {
            width: 100%;
            min-height: 46px;
            margin-top: 5px;
            border: 0;
            border-radius: 7px;
            background: #286184;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 650;
        }
        a { display: inline-block; margin-top: 20px; color: #286184; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>Create an account</h1>
        <p class="intro">Register for a student services account.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create account</button>
        </form>
        <a href="{% url 'login' %}">Already have an account? Sign in</a>
    </main>
</body>
</html>
