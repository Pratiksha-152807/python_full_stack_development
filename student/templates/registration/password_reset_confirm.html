<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password | Student services</title>
    <style>
        body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; background: #f3f5f8; color: #1d2c3b; font-family: "Segoe UI", Arial, sans-serif; }
        main { width: min(100%, 390px); padding: 36px; border: 1px solid #dce3e9; border-radius: 12px; background: #fff; box-shadow: 0 16px 42px rgba(27, 47, 66, .1); }
        h1 { margin: 0; color: #18354a; font-size: 27px; }
        p { color: #627181; font-size: 14px; line-height: 1.6; }
        form p { margin: 0 0 16px; }
        label { display: block; margin-bottom: 7px; color: #293d4e; font-size: 13px; font-weight: 650; }
        input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #cbd5de; border-radius: 7px; box-sizing: border-box; font: inherit; }
        button { width: 100%; min-height: 46px; margin-top: 18px; border: 0; border-radius: 7px; background: #286184; color: #fff; cursor: pointer; font: inherit; font-weight: 650; }
        ul.errorlist { color: #963b35; font-size: 12px; }
    </style>
</head>
<body>
    <main>
        {% if validlink %}
            <h1>Choose a new password</h1>
            <p>Enter and confirm your new password below.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Change password</button>
            </form>
        {% else %}
            <h1>Reset link expired</h1>
            <p>This password reset link is invalid or has already been used. Request a new one to continue.</p>
            <a href="{% url 'password_reset' %}">Request another reset link</a>
        {% endif %}
    </main>
</body>
</html>
