<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check your email | Student services</title>
    <style>
        body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; background: #f3f5f8; color: #1d2c3b; font-family: "Segoe UI", Arial, sans-serif; }
        main { width: min(100%, 390px); padding: 36px; border: 1px solid #dce3e9; border-radius: 12px; background: #fff; box-shadow: 0 16px 42px rgba(27, 47, 66, .1); }
        h1 { margin: 0; color: #18354a; font-size: 27px; }
        p { color: #627181; font-size: 14px; line-height: 1.6; }
        a { display: inline-block; margin-top: 12px; color: #286184; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>Check your email</h1>
        <p>If an account exists for the email address you entered, password reset instructions have been sent.</p>
        <a href="{% url 'login' %}">Back to sign in</a>
    </main>
</body>
</html>
